# pgPulse — one-command demo
#   cp .env.example .env
#   docker compose up --build
#   open http://localhost:5173
#
# Services
#   postgres  PostgreSQL 16 with pg_stat_statements: demo_shop (monitored) + pgpulse (app)
#   loadgen   fake traffic: pgbench + deliberately slow queries
#   server    pgPulse API (Express + Socket.IO), read-only access to demo_shop
#   web       pgPulse UI (static React build served by nginx)
#
# Host ports are configurable in .env: POSTGRES_PORT, SERVER_PORT, WEB_PORT.

name: pgpulse

services:
  postgres:
    image: postgres:16
    command:
      - postgres
      # pg_stat_statements must be loaded at server start to record query stats
      - -c
      - shared_preload_libraries=pg_stat_statements
      # track statements inside functions too, not only top-level ones
      - -c
      - pg_stat_statements.track=all
      # time spent reading/writing blocks — useful for later diagnostics pages
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      READER_USER: ${READER_USER:-pgpulse_reader}
      READER_PASSWORD: ${READER_PASSWORD:?set READER_PASSWORD in .env}
    ports:
      # host:container — host side configurable in case 5432 is already taken
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in docker-entrypoint-initdb.d run ONLY on an empty data volume
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./docker/postgres/init.sql:/pgpulse/init.sql:ro
    healthcheck:
      # -h localhost forces TCP: during first-run init Postgres only listens on
      # a unix socket, so this check passes only once init has fully finished.
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d demo_shop"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  loadgen:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: demo_shop
    volumes:
      - ./docker/loadgen/run.sh:/loadgen/run.sh:ro
    # Run through bash so the script works even without the exec bit (Windows checkouts)
    entrypoint: ["bash", "/loadgen/run.sh"]
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the compose network the database is reached by its service name
      # ("postgres") on its container port (5432), not localhost:5433.
      # Passwords containing URL special characters (@ : / ?) must be %-encoded here.
      TARGET_DATABASE_URL: postgres://${READER_USER:-pgpulse_reader}:${READER_PASSWORD}@postgres:5432/demo_shop
      APP_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/pgpulse
      SERVER_PORT: 4000
      # The browser loads the UI from the web container's HOST port
      CORS_ORIGIN: http://localhost:${WEB_PORT:-5173}
      COLLECT_INTERVAL_MS: ${COLLECT_INTERVAL_MS:-2000}
      SAMPLE_INTERVAL_MS: ${SAMPLE_INTERVAL_MS:-60000}
      TARGET_STATEMENT_TIMEOUT_MS: ${TARGET_STATEMENT_TIMEOUT_MS:-5000}
    ports:
      - "${SERVER_PORT:-4000}:4000"
    healthcheck:
      # busybox wget ships with alpine; /api/health answers 200 while the API is up
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the JS bundle: the BROWSER calls this URL, so it must be the
        # server's host-facing address, not the internal "server:4000".
        VITE_API_URL: http://localhost:${SERVER_PORT:-4000}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:8080"
    restart: unless-stopped

volumes:
  pgdata:
