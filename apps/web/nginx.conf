# Static hosting for the pgPulse single-page app.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Vite puts a content hash in asset filenames, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routing: unknown paths (e.g. /queries) get index.html and
  # React Router takes over. index.html itself is never cached, so a new
  # deploy is picked up on the next page load.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
